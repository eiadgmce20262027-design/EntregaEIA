  let escuelaElegida = null;

  const NIVEL_LABELS = { preescolar: 'Preescolar', primaria: 'Primaria', secundaria: 'Secundaria' };

  function renderTrail(){
    trailEl.innerHTML = '';

      const dot = document.createElement('div');
      dot.className = 'stamp-dot' + (step > i ? ' done' : '') + (step === i ? ' current' : '');
      dot.textContent = i;
      trailEl.appendChild(dot);
    }
  }

  function renderStep1(){
    cardEl.innerHTML = `

      <p class="q-text">¿Cuál es tu nivel educativo?</p>
      <div class="nivel-grid">
        <button class="nivel-btn" data-n="preescolar">Preescolar</button>
        <button class="nivel-btn" data-n="primaria">Primaria</button>
        <button class="nivel-btn" data-n="secundaria">Secundaria</button>
      </div>
    `;

        nivelElegido = btn.dataset.n;
        step = 2;
        renderTrail();
        renderStep2();

    });
  }

    cardEl.innerHTML = `

      <div class="back-row">
        <button class="link-btn" id="backBtn">&larr; Cambiar nivel educativo</button>
      </div>
    `;

    const input = document.getElementById('searchInput');
    const list = document.getElementById('resultsList');

    function renderResults(query){
      const q = query.trim().toLowerCase();
      const pool = SCHOOLS.filter(s => s.nivel === nivelElegido);
      let matches = pool;
      if (q.length > 0){
        matches = pool.filter(s =>
          s.nombre.toLowerCase().includes(q) || s.cct.toLowerCase().includes(q)
        );
      }
      if (matches.length === 0){
        list.innerHTML = '<div class="no-results">No se encontraron escuelas con ese nombre. Verifica la ortografía o intenta con menos palabras.</div>';
        return;
      }

      list.innerHTML = matches.map((s, i) => `
        <button class="result-item" data-idx="${SCHOOLS.indexOf(s)}">
          ${s.nombre}
          <span class="cct-tag">CCT: ${s.cct}</span>
        </button>
      `).join('');

      list.querySelectorAll('.result-item').forEach(btn => {
        btn.addEventListener('click', () => {
          escuelaElegida = SCHOOLS[parseInt(btn.dataset.idx, 10)];
          step = 3;
          renderTrail();
          renderFinal();
        });
      });
    }

    renderResults('');
    input.addEventListener('input', () => renderResults(input.value));
    input.focus();

    document.getElementById('backBtn').addEventListener('click', () => {
      nivelElegido = null;
      step = 1;
      renderTrail();
      renderStep1();
    });
  }

  function renderFicha(docs){
    const entries = Object.entries(docs);
    if (entries.length === 0) return '';
    const rows = entries.map(([nombre, cantidad]) => `
      <div class="doc-row">
        <span class="dname">${nombre}</span>
        <span class="dqty">${cantidad}</span>
      </div>
    `).join('');
    return `
      <div class="ficha">
        <div class="ficha-title">Ficha técnica — lo que encontrarás</div>

      </div>
